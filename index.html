<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ultracortex 3D Viewer</title>
  <style>
    html, body { height: 100%; margin: 0; background:#0b0f14; color:#e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    header { padding: 12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid rgba(255,255,255,.08); }
    header .badge { font-size: 12px; padding: 2px 8px; border-radius:999px; background: rgba(255,255,255,.08); }
    main { height: calc(100% - 54px); }
    model-viewer { width: 100%; height: 100%; background:#0b0f14; }
    a { color:#7dd3fc; text-decoration:none; }
    .hint { opacity:.8; font-size:12px; margin-left:auto; }
  </style>

  <!-- <model-viewer> (Google) -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <strong>Ultracortex</strong>
    <span class="badge">ChetnaCap</span>
    <span class="hint">Rotate: drag • Zoom: scroll/pinch • Pan: right-drag/2-finger</span>
  </header>

  <main>
    <model-viewer
      id="model"
      src="model.glb"  <!-- keep the correct filename here -->
      alt="ChetnaCap model"
      camera-controls
      auto-rotate
      environment-image="neutral"
      exposure="1"
      shadow-intensity="1"
    >
      <div style="color:#fff; padding:20px; text-align:center">
        Your browser does not support WebGL or the model failed to load.
      </div>
    </model-viewer>
  </main>

  <script>
  // Git commands to update the repository
  const { exec } = require('child_process');

  exec('cd "C:\\Users\\Ashit Rai\\Downloads" && git clone https://github.com/ashitrai04/tata-elxsi-autism.git', (error, stdout, stderr) => {
    if (error) {
      console.error(`Error: ${error.message}`);
      return;
    }
    if (stderr) {
      console.error(`Stderr: ${stderr}`);
      return;
    }
    console.log(`Stdout: ${stdout}`);
  });
</script>
</body>
</html>
