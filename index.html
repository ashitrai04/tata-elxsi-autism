<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GLB Viewer</title>
    <style>
      html,body { height:100%; margin:0; background:#111; }
      .viewer-wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
      model-viewer { width:90vw; height:90vh; }
      .device-name {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffffff;
        font-size: 3rem;
        font-weight: 700;
        text-align: center;
        z-index: 20;
        pointer-events: none;
      }
    </style>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <body>
    <div class="viewer-wrap">
      <div class="device-name">ChetnaCap</div>

      <!-- Put your .glb file next to this index.html and name it `model.glb` (or edit src) -->
      <model-viewer
        id="model"
        src="model.glb"
        alt="3D model"
        camera-controls
        auto-rotate
        environment-image="neutral"
        exposure="1"
        shadow-intensity="1"
        poster=""
      >
        <div style="color:#fff; padding:20px; text-align:center">Your browser does not support WebGL or the model failed to load.</div>
      </model-viewer>
    </div>
  </body>
</html>
